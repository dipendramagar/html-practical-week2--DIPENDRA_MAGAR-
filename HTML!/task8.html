<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>My Media Hub</title>

    <link rel="icon"
          href="https://www.w3.org/html/logo/downloads/HTML5_Logo_512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
          rel="stylesheet">
</head>

<body>

    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        allowfullscreen>
    </iframe>

    <h2>Local Video</h2>

    <video width="500" controls>

        <source src="video.mp4" type="video/mp4">

        <source src="video.webm" type="video/webm">

        Your browser does not support the video element.

    </video>

    <h2>Audio</h2>

    <audio controls>

        <source src="audio.mp3" type="audio/mpeg">

        <source src="audio.ogg" type="audio/ogg">

        Your browser does not support the audio element.

    </audio>

    <h2>Google Map</h2>

    <iframe
        src="https://www.google.com/maps?q=PCPS+College+Kupondole&output=embed"
        width="600"
        height="450">
    </iframe>

    <h2>External Webpage</h2>

    <iframe
        src="https://example.com"
        width="600"
        height="400"
        title="External webpage">
    </iframe>

    <h2>PDF Document</h2>

    <embed
        src="sample.pdf"
        type="application/pdf"
        width="600"
        height="500">

</body>
</html>
