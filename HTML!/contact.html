<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Dipendra</title>
</head>
<body>

    <header>
        <h1>Contact Me</h1>
        <p>Get in touch with me</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>

            <h2>Contact Form</h2>

            <article>

                <form>

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">

                    <br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">

                    <br><br>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">

                    <br><br>

                    <p>Gender:</p>

                    <input type="radio"
                           id="male"
                           name="gender"
                           value="Male">

                    <label for="male">Male</label>

                    <input type="radio"
                           id="female"
                           name="gender"
                           value="Female">

                    <label for="female">Female</label>

                    <br><br>

                    <p>Interests:</p>

                    <input type="checkbox"
                           id="programming"
                           name="interest"
                           value="Programming">

                    <label for="programming">Programming</label>

                    <br>

                    <input type="checkbox"
                           id="web"
                           name="interest"
                           value="Web Development">

                    <label for="web">Web Development</label>

                    <br>

                    <input type="checkbox"
                           id="database"
                           name="interest"
                           value="Database">

                    <label for="database">Database</label>

                    <br><br>

                    <label for="department">Department:</label>

                    <select id="department" name="department">

                        <option value="software">
                            Software Engineering
                        </option>

                        <option value="computer">
                            Computer Science
                        </option>

                        <option value="it">
                            Information Technology
                        </option>

                    </select>

                    <br><br>

                    <label for="message">Message:</label>

                    <br>

                    <textarea id="message"
                              name="message"
                              rows="5"
                              cols="40"></textarea>

                    <br><br>

                    <input type="submit" value="Send Message">

                </form>

            </article>

        </section>

        <section>

            <h2>My Location</h2>

            <iframe
                src="https://www.google.com/maps?q=PCPS+College+Kupondole&output=embed"
                width="600"
                height="400">
            </iframe>

        </section>

        <section>

            <h2>Contact Information</h2>

            <p>
                Email:
                <a href="mailto:dipendra@example.com">
                    dipendra@example.com
                </a>
            </p>

            <p>
                Visit my
                <a href="https://github.com" target="_blank">
                    GitHub
                </a>
            </p>

        </section>

    </main>

    <footer>
        <p>Copyright 2026 Dipendra Magar</p>
    </footer>

</body>
</html>
